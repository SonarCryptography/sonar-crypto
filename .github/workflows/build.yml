name: Build & Test

on:
  workflow_call:
  push:
    branches: [ main ]
  pull_request:

jobs:
  spotless-check:
    name: Code Formatting Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Cache Maven packages
        uses: actions/cache@v6
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
      - name: Run Spotless Check
        run: mvn spotless:check -B

  build-linux:
    name: Build & Unit Tests & SQ
    runs-on: ubuntu-latest
    needs: spotless-check
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: 'recursive'
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Cache SonarQube packages
        uses: actions/cache@v6
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: Compute submodule hashes for cache key
        shell: bash
        run: git submodule status --cached > .submodule-hashes
      - name: Cache Maven packages
        uses: actions/cache@v6
        with:
          path: |
            ~/.m2
            external/.deps-installed
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}-${{ hashFiles('.submodule-hashes') }}
          restore-keys: ${{ runner.os }}-m2
      - name: Delete stale deps flag if submodules changed
        shell: bash
        run: |
          if [ -f external/.deps-installed ]; then
            current=$(git rev-parse HEAD:external/Boomerang HEAD:external/CryptoAnalysis HEAD:external/Crypto-API-Rules)
            stored=$(cat external/.deps-installed)
            if [ "$current" != "$stored" ]; then
              rm external/.deps-installed
              echo "Submodule commits changed; deleted external/.deps-installed to trigger reinstall."
            fi
          fi
      - name: Build & Test (No E2E) & Analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: mvn verify -pl '!e2e' -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.projectKey=SonarCryptography_sonar-crypto -Pcoverage

  build-windows:
    name: Build & Unit Tests
    runs-on: windows-latest
    needs: spotless-check
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: 'recursive'
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Compute submodule hashes for cache key
        shell: bash
        run: git submodule status --cached > .submodule-hashes
      - name: Cache Maven packages
        uses: actions/cache@v6
        with:
          path: |
            ~/.m2
            external/.deps-installed
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}-${{ hashFiles('.submodule-hashes') }}
          restore-keys: ${{ runner.os }}-m2
      - name: Delete stale deps flag if submodules changed
        shell: bash
        run: |
          if [ -f external/.deps-installed ]; then
            current=$(git rev-parse HEAD:external/Boomerang HEAD:external/CryptoAnalysis HEAD:external/Crypto-API-Rules)
            stored=$(cat external/.deps-installed)
            if [ "$current" != "$stored" ]; then
              rm external/.deps-installed
              echo "Submodule commits changed; deleted external/.deps-installed to trigger reinstall."
            fi
          fi
      - name: Build & Test (No E2E) & Analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: mvn verify -pl '!e2e' -B

  e2e-test:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: spotless-check
    env:
      ARTIFACTORY_URL: https://repo1.maven.org/maven2
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: 'recursive'
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Compute submodule hashes for cache key
        shell: bash
        run: git submodule status --cached > .submodule-hashes
      - name: Cache Maven packages
        uses: actions/cache@v6
        with:
          path: |
            ~/.m2
            external/.deps-installed
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}-${{ hashFiles('.submodule-hashes') }}
          restore-keys: ${{ runner.os }}-m2
      - name: Delete stale deps flag if submodules changed
        shell: bash
        run: |
          if [ -f external/.deps-installed ]; then
            current=$(git rev-parse HEAD:external/Boomerang HEAD:external/CryptoAnalysis HEAD:external/Crypto-API-Rules)
            stored=$(cat external/.deps-installed)
            if [ "$current" != "$stored" ]; then
              rm external/.deps-installed
              echo "Submodule commits changed; deleted external/.deps-installed to trigger reinstall."
            fi
          fi
      - name: Build Plugin
        run: mvn install -pl '!e2e' -DskipTests -B
      - name: E2E Tests
        run: mvn test -pl e2e -B
